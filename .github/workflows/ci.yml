name: GUNDAM UNIVERSE BOARD CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gundam_board
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gundam_board"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gundam_board
      E2E_TEST_MODE: "true"
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: ci-test-google-client-id

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Linter
        run: |
          cd backend
          # 만약 flake8이 requirements.txt에 없으면 직접 설치 후 실행
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        run: |
          cd backend
          pytest

  frontend-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Project
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: dummy-client-id

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    env:
      # docker-compose 가 백엔드에 주입하는 값 — 테스트 로그인 시드 활성화
      E2E_TEST_MODE: "true"
      JWT_SECRET: ci-e2e-secret
      GOOGLE_CLIENT_ID: ci-e2e-google-client-id
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-e2e-google-client-id

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start full stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend /health ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "backend up"; break; fi
            sleep 5
          done
          echo "Waiting for frontend :3000 ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then echo "frontend up"; break; fi
            sleep 5
          done

      - name: Install E2E dependencies
        run: |
          cd e2e
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd e2e
          npx playwright test

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
